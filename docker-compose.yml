services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club_management
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_management"]
      interval: 5s
      timeout: 5s
      retries: 10
